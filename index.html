<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Tạo Menu Dọc</title>
    <style>
        /* 1. Reset font và khoảng cách cơ bản */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 30px;
            background-color: #f4f6f8;
        }

        h2 {
            margin-bottom: 20px;
            color: #333333;
        }

        /* 2. Khung chứa menu */
        #menu {
            width: 140px;
        }

        #menu ul {
            list-style: none;
        }

        /* 3. Định dạng cho các phần tử danh sách (li) */
        #menu li {
            list-style: none;
            position: relative; /* Cho phép menu con căn chỉnh theo menu cha */
            width: 140px;
            height: 30px;
            padding: 0 20px;
            background-color: #000000;
            line-height: 30px;
            cursor: pointer;
            border-bottom: 1px solid #222222;
        }

        /* 4. Định dạng liên kết (thẻ a) */
        #menu li a {
            text-decoration: none;
            color: #ffffff;
            display: block;
            font-size: 14px;
        }

        /* 5. Đổi màu nền khi di chuột qua phần tử danh sách */
        #menu li:hover {
            background-color: #04AA6D;
        }

        /* 6. Định dạng danh sách con (Submenu) - Mặc định ẩn */
        #menu li ul {
            position: absolute;
            top: 0;
            left: 140px; /* Xuất hiện ngay sát cạnh bên phải của mục cha */
            visibility: hidden;
            display: block;
        }

        /* 7. Hiển thị danh sách con khi di chuột vào mục cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <h2>Trình Đơn Dọc (Vertical Dropdown Menu)</h2>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm &#9656;</a>
                <!-- Menu con cấp 1 -->
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                    <li>
                        <a href="#">Laptop &#9656;</a>
                        <!-- Menu con cấp 2 -->
                        <ul>
                            <li><a href="#">MacBook</a></li>
                            <li><a href="#">Dell XPS</a></li>
                            <li><a href="#">ThinkPad</a></li>
                        </ul>
                    </li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ &#9656;</a>
                <ul>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Sửa chữa</a></li>
                </ul>
            </li>
            <li><a href="#">Tin tức</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
